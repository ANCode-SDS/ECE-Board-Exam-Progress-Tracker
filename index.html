<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --warning: #d97706;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --row-hover: #f8fafc;
      --row-highlight: #f1f5f9;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --card: #111827;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.1);
      --warning: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --row-hover: #1e293b;
      --row-highlight: #162032;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 1rem 4rem 1rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .top-bar {
      height: 5px;
      background: linear-gradient(90deg, #2563eb, #06b6d4, #10b981);
      margin: 0 -1rem 2rem -1rem;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: var(--shadow-md);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
      display: block;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-outline {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: var(--row-hover);
      border-color: var(--muted);
    }

    .btn-icon {
      padding: 0.55rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
    }

    /* Tabs Navigation */
    .tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .tab-btn:hover {
      background: var(--row-hover);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(37, 99, 235, 0.25);
    }

    /* Scoreboard Card */
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 1rem;
      z-index: 20;
    }

    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tab-info-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .combine-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      background: var(--bg);
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 800;
      margin-top: 0.2rem;
      letter-spacing: -0.02em;
    }

    .stat-subtext {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      margin-top: 1.15rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #10b981);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Category Cards */
    .category-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
    }

    .category-header {
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .category-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr.row-checked {
      background-color: var(--success-soft);
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    td {
      padding: 0.65rem 0.5rem;
      vertical-align: middle;
    }

    tfoot tr {
      background-color: var(--row-highlight);
      border-top: 2px solid var(--border);
      font-weight: 700;
    }

    tfoot td {
      padding: 0.8rem 0.5rem;
      color: var(--text);
      font-size: 0.9rem;
    }

    .section-total-earned {
      color: var(--success);
      font-weight: 800;
    }

    /* Checkbox Styling */
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--success);
      cursor: pointer;
      border-radius: 4px;
    }

    .earned-badge {
      display: inline-block;
      background: var(--success-soft);
      color: var(--success);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      white-space: nowrap;
    }
  </style>
</head>

    <div class="progress-track">
      <div class="progress-fill" id="grade-progress-bar"></div>
    </div>
  </div>

  <!-- Topics & Subtopics Container -->
  <div id="categories-container"></div>
</div>

  let appState = JSON.parse(localStorage.getItem("eceChecklistState")) || {
    activeTabId: "math",
    combineAll: false,
    data: boardSubjects
  };

  const savedTheme = localStorage.getItem("eceTrackerTheme") || "light";
  if (savedTheme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("theme-toggle").textContent = "☀️";
  }

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    if (isDark) {
      document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("eceTrackerTheme", "light");
      document.getElementById("theme-toggle").textContent = "🌙";
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      localStorage.setItem("eceTrackerTheme", "dark");
      document.getElementById("theme-toggle").textContent = "☀️";
    }
  }

  function saveData() {
    localStorage.setItem("eceChecklistState", JSON.stringify(appState));
  }

  function getActiveSubject() {
    return appState.data.find(s => s.id === appState.activeTabId) || appState.data[0];
  }

  function switchTab(tabId) {
    appState.activeTabId = tabId;
    saveData();
    render();
  }

  function toggleCombineMode(checked) {
    appState.combineAll = checked;
    saveData();
    recalculateTotals();
  }

  function renderTabs() {
    const tabsBar = document.getElementById("tabs-bar");
    if (!tabsBar) return;
    tabsBar.innerHTML = "";

    appState.data.forEach(sub => {
      const btn = document.createElement("button");
      btn.className = `tab-btn ${sub.id === appState.activeTabId ? "active" : ""}`;
      btn.textContent = sub.name;
      btn.onclick = () => switchTab(sub.id);
      tabsBar.appendChild(btn);
    });
  }

  function render() {
    renderTabs();
    const activeSub = getActiveSubject();
    if (!activeSub) return;
    
    const combineCheckbox = document.getElementById("combine-tabs-checkbox");
    if (combineCheckbox) combineCheckbox.checked = appState.combineAll;

    const scoreboardTitle = document.getElementById("scoreboard-title");
    if (scoreboardTitle) {
      scoreboardTitle.textContent = appState.combineAll 
        ? "Overall ECE Board Exam Mastery (Combined Out of 100%)" 
        : `${activeSub.fullName}`;
    }

    const container = document.getElementById("categories-container");
    if (!container) return;
    container.innerHTML = "";

    activeSub.categories.forEach((cat, catIndex) => {
      const card = document.createElement("div");
      card.className = "category-card";

      let catWeight = 0;
      let catEarned = 0;
      let catMaxItems = 0;

      const rowsHtml = cat.items.map((item, itemIndex) => {
        const weightNum = parseFloat(item.weight) || 0;
        const maxNum = parseFloat(item.max) || 0;
        const isStudied = item.studied;

        const earned = isStudied ? weightNum : 0;

        catWeight += weightNum;
        catEarned += earned;
        catMaxItems += maxNum;

        return `
          <tr id="row-${activeSub.id}-${catIndex}-${itemIndex}" class="${isStudied ? 'row-checked' : ''}">
            <td style="width: 10%; text-align: center;">
              <input type="checkbox" ${isStudied ? 'checked' : ''}
                onchange="toggleStudied('${activeSub.id}', ${catIndex}, ${itemIndex}, this.checked)" />
            </td>
            <td style="width: 45%;">
              <span style="font-weight: 500; font-size: 0.92rem;">${escapeHtml(item.subtopic)}</span>
            </td>
            <td style="width: 15%; color: var(--muted); font-weight: 600;">
              ${item.max} items
            </td>
            <td style="width: 15%; color: var(--muted);">
              ${weightNum.toFixed(1)}%
            </td>
            <td style="width: 15%;">
              <span class="earned-badge" id="earned-${activeSub.id}-${catIndex}-${itemIndex}">
                ${earned.toFixed(2)} pts
              </span>
            </td>
          </tr>
        `;
      }).join("");

      card.innerHTML = `
        <div class="category-header">
          <h3 class="category-title">${escapeHtml(cat.name)}</h3>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th style="text-align: center;">Studied</th>
                <th>Subtopic / Competency</th>
                <th>Total Items</th>
                <th>TOS Weight</th>
                <th>Mastered Pts</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="2">SECTION TOTAL</td>
                <td id="cat-items-total-${activeSub.id}-${catIndex}">${catMaxItems} items</td>
                <td id="cat-weight-total-${activeSub.id}-${catIndex}">${catWeight.toFixed(1)}%</td>
                <td class="section-total-earned" id="cat-earned-total-${activeSub.id}-${catIndex}">
                  ${catEarned.toFixed(2)} / ${catWeight.toFixed(1)}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      container.appendChild(card);
    });

    recalculateTotals();
  }

  function toggleStudied(subId, catIndex, itemIndex, isChecked) {
    const sub = appState.data.find(s => s.id === subId);
    if (sub) {
      sub.categories[catIndex].items[itemIndex].studied = isChecked;
      saveData();
      
      // Update row background style instantly without full re-render
      const row = document.getElementById(`row-${subId}-${catIndex}-${itemIndex}`);
      if (row) {
        if (isChecked) row.classList.add('row-checked');
        else row.classList.remove('row-checked');
      }

      recalculateTotals();
    }
  }

  function resetChecklist() {
    if (confirm("Reset all study checkboxes back to unchecked?")) {
      appState.data.forEach(sub => {
        sub.categories.forEach(cat => {
          cat.items.forEach(item => {
            item.studied = false;
          });
        });
      });
      saveData();
      render();
    }
  }

  function calculateSubjectTotals(sub) {
    let subEarned = 0;
    let subWeight = 0;

    sub.categories.forEach(cat => {
      cat.items.forEach(item => {
        const weight = parseFloat(item.weight) || 0;
        if (item.studied) {
          subEarned += weight;
        }
        subWeight += weight;
      });
    });

    return { earned: subEarned, weight: subWeight };
  }

  function recalculateTotals() {
    const activeSub = getActiveSubject();
    if (!activeSub) return;

    activeSub.categories.forEach((cat, catIndex) => {
      let catEarned = 0;
      let catWeight = 0;

      cat.items.forEach((item, itemIndex) => {
        const weight = parseFloat(item.weight) || 0;
        const earned = item.studied ? weight : 0;

        catEarned += earned;
        catWeight += weight;

        const earnedEl = document.getElementById(`earned-${activeSub.id}-${catIndex}-${itemIndex}`);
        if (earnedEl) earnedEl.textContent = `${earned.toFixed(2)} pts`;
      });

      const catEarnedEl = document.getElementById(`cat-earned-total-${activeSub.id}-${catIndex}`);
      if (catEarnedEl) catEarnedEl.textContent = `${catEarned.toFixed(2)} / ${catWeight.toFixed(1)}`;
    });

    let displayEarned = 0;
    let displayScale = 100;

    if (appState.combineAll) {
      appState.data.forEach(sub => {
        const res = calculateSubjectTotals(sub);
        displayEarned += res.earned;
      });
      displayScale = 100;
      const pointsLabel = document.getElementById("points-label");
      const pointsSubtext = document.getElementById("points-subtext");
      if (pointsLabel) pointsLabel.textContent = "Overall Board Mastery Score";
      if (pointsSubtext) pointsSubtext.textContent = "Combined across Math, Elex, Geas, Est";
    } else {
      const res = calculateSubjectTotals(activeSub);
      displayEarned = res.earned;
      displayScale = activeSub.maxScoreScale;
      const pointsLabel = document.getElementById("points-label");
      const pointsSubtext = document.getElementById("points-subtext");
      if (pointsLabel) pointsLabel.textContent = `${activeSub.name} Mastery Points`;
      if (pointsSubtext) pointsSubtext.textContent = `Completed out of ${displayScale} pts`;
    }

    const percentage = (displayEarned / displayScale) * 100;

    const totalPointsEl = document.getElementById("total-points");
    const totalGradeEl = document.getElementById("total-grade");
    const totalWeightEl = document.getElementById("total-weight");
    if (totalPointsEl) totalPointsEl.textContent = `${displayEarned.toFixed(2)} / ${displayScale}`;
    if (totalGradeEl) totalGradeEl.textContent = `${percentage.toFixed(2)}%`;
    if (totalWeightEl) totalWeightEl.textContent = `${displayScale}%`;

    const progressEl = document.getElementById("grade-progress-bar");
    if (progressEl) {
      const clampedPct = Math.min(100, Math.max(0, percentage));
      progressEl.style.width = `${clampedPct}%`;
    }

    const statusEl = document.getElementById("weight-status");
    if (statusEl) {
      if (percentage >= 70) {
        statusEl.textContent = "Target Mastery Reached (>= 70%) 🎉";
        statusEl.style.color = "var(--success)";
      } else {
        statusEl.textContent = "Keep checking off topics to pass!";
        statusEl.style.color = "var(--warning)";
      }
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Initialize execution
  render();
</script>
